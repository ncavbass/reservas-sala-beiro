<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA DE RESERVAS SALA BEIRÓ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1ECE1;
    --paper-line:#DCD3BE;
    --ink:#26313A;
    --ink-soft:#5B6670;
    --ink-faint:#8B9299;
    --teal:#1F6F5C;
    --teal-dark:#154A3E;
    --teal-wash:#E1EDE8;
    --red:#B3402F;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    padding:32px 20px 56px;
  }
  header{
    border-bottom:1px solid var(--paper-line);
    padding-bottom:20px;
    margin-bottom:24px;
  }
  header h1{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header p{
    font-size:14px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.5;
    max-width:46ch;
  }

  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 0 14px;
  }
  .month-nav button,
  .payments-month-nav button{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--paper-line);
    background:var(--white);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .month-nav button:hover,
  .payments-month-nav button:hover{
    border-color:var(--teal);
    color:var(--teal);
  }
  #monthLabel,
  #paymentMonthLabel{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:18px;
    text-transform:capitalize;
    margin:0;
  }

  #weekdays{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:4px;
    font-size:11px;
    color:var(--ink-faint);
    text-align:center;
    padding-bottom:6px;
    text-transform:lowercase;
  }
  #calendarGrid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:4px;
  }
  .day-cell{
    aspect-ratio:1;
    border-radius:6px;
    border:1px solid var(--paper-line);
    background:var(--white);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
    padding:2px;
    font-family:'Inter',sans-serif;
  }
  .day-cell:hover{ border-color:var(--teal); }
  .day-cell.selected{ background:var(--teal-wash); border-color:var(--teal); }
  .day-cell.past{ opacity:0.4; }
  .day-num{ font-size:13px; }
  .day-num.today{ color:var(--teal-dark); font-weight:600; }
  .day-dot{ font-size:9px; color:var(--teal); letter-spacing:1px; line-height:1; }

  #dayPanel{
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid var(--paper-line);
  }
  #dayPanel h2{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:16px;
    margin:0 0 14px;
    text-transform:capitalize;
  }
  .empty-note{ font-size:13px; color:var(--ink-faint); margin:0 0 18px; }
  .res-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 12px;
    background:var(--white);
    border:1px solid var(--paper-line);
    border-radius:6px;
    margin-bottom:6px;
  }
  .res-left{ display:flex; align-items:baseline; gap:10px; }
  .res-time{ font-size:13px; color:var(--teal-dark); font-weight:600; min-width:42px; }
  .res-name{ font-size:14px; }
  .del-btn{
    width:26px; height:26px; border:none; background:transparent;
    color:var(--ink-faint); cursor:pointer; font-size:16px; line-height:1;
    border-radius:4px;
  }
  .del-btn:hover{ color:var(--red); background:#F4E6E3; }
  .past-note{ font-size:13px; color:var(--ink-faint); margin:14px 0 0; }

  form{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-top:16px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:12px; color:var(--ink-soft); }
  .field.name{ flex:1; min-width:150px; }
  .field.time{ width:110px; }
  input[type=text], input[type=time], input[type=email], input[type=password]{
    height:36px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    background:var(--white);
    padding:0 10px;
    font-size:14px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  input:focus{
    outline:none;
    border-color:var(--teal);
    box-shadow:0 0 0 2px var(--teal-wash);
  }
  button[type=submit], .plain-btn{
    height:36px;
    padding:0 16px;
    border:none;
    border-radius:6px;
    background:var(--teal);
    color:var(--white);
    font-size:14px;
    font-weight:500;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  button[type=submit]:hover, .plain-btn:hover{ background:var(--teal-dark); }
  .error-msg{
    font-size:13px;
    color:var(--red);
    margin:8px 0 0;
    width:100%;
    display:none;
  }

  /* PAGOS */
  #paymentsSection{
    margin-top:34px;
    padding-top:24px;
    border-top:1px solid var(--paper-line);
  }
  .payments-title{
    font-family:'Source Serif 4',serif;
    font-size:20px;
    font-weight:600;
    margin:0 0 4px;
  }
  .payments-subtitle{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .payments-month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    margin:18px 0 12px;
  }
  .payments-summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    font-size:13px;
    margin-bottom:8px;
  }
  .payments-summary strong{ color:var(--teal-dark); }
  .progress{
    width:100%;
    height:6px;
    background:var(--paper-line);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:14px;
  }
  .progress > div{
    height:100%;
    background:var(--teal);
    border-radius:999px;
    transition:width .2s ease;
  }
  .payment-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .payment-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 12px;
    background:var(--white);
    border:1px solid var(--paper-line);
    border-radius:6px;
  }
  .payment-person{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
    font-size:14px;
  }
  .payment-dot{
    width:17px;
    height:17px;
    border-radius:50%;
    border:1px solid var(--paper-line);
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 17px;
    font-size:11px;
    color:var(--white);
    background:var(--white);
  }
  .payment-row.paid .payment-dot{
    background:var(--teal);
    border-color:var(--teal);
  }
  .payment-status{
    font-size:12px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .payment-row.paid .payment-status{
    color:var(--teal-dark);
    font-weight:600;
  }
  .payment-toggle{
    height:28px;
    padding:0 9px;
    border:1px solid var(--paper-line);
    border-radius:5px;
    background:var(--white);
    color:var(--ink-soft);
    font:500 12px 'Inter',sans-serif;
    cursor:pointer;
  }
  .payment-toggle:hover{
    border-color:var(--teal);
    color:var(--teal-dark);
  }
  .admin-area{
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
  }
  .admin-link{
    border:none;
    background:transparent;
    color:var(--ink-faint);
    font:500 12px 'Inter',sans-serif;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .admin-login{
    margin-top:12px;
    padding:12px;
    border:1px solid var(--paper-line);
    background:rgba(255,255,255,.45);
    border-radius:6px;
  }
  .admin-login form{
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:10px;
    flex-wrap:nowrap;
  }
  .admin-login .field{
    flex:none;
    width:100%;
    min-width:0;
  }
  .admin-login button[type=submit]{
    align-self:flex-start;
  }
  .password-wrap{
    position:relative;
    display:flex;
    width:100%;
  }
  .password-wrap input{
    flex:1;
    width:100%;
    padding-right:64px;
  }
  .password-toggle{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:transparent;
    color:var(--teal-dark);
    font:600 11px 'Inter',sans-serif;
    cursor:pointer;
    padding:6px 8px;
    border-radius:4px;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
  }
  .password-toggle:hover{
    background:var(--teal-wash);
  }
  .password-toggle:active{
    background:var(--teal-wash);
  }
  .admin-lock-msg{
    font-size:12px;
    color:var(--red);
    margin:0;
    line-height:1.5;
  }
  .admin-state{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    font-size:12px;
    color:var(--teal-dark);
  }
  .admin-logout{
    border:none;
    background:transparent;
    color:var(--ink-faint);
    font:500 12px 'Inter',sans-serif;
    text-decoration:underline;
    cursor:pointer;
  }
  .payment-note{
    margin:10px 0 0;
    font-size:11px;
    line-height:1.45;
    color:var(--ink-faint);
  }

  @media (max-width:420px){
    header h1{ font-size:22px; }
    .day-num{ font-size:12px; }
    .payment-row{ padding:9px 10px; }
    .payment-toggle{ padding:0 7px; }
  }
</style>
</head>

<body>
<div id="app">
  <header>
    <h1>SISTEMA DE RESERVAS SALA BEIRÓ</h1>
    <p>Escribí tu nombre, elegí día y franja horaria para reservar la sala. Sin registro ni contraseña — lo ve y edita todo el grupo.</p>
  </header>

  <div class="month-nav">
    <button id="prevMonth" aria-label="Mes anterior">&#8249;</button>
    <p id="monthLabel"></p>
    <button id="nextMonth" aria-label="Mes siguiente">&#8250;</button>
  </div>

  <div id="weekdays"></div>
  <div id="calendarGrid"></div>

  <div id="dayPanel"></div>

  <section id="paymentsSection">
    <h2 class="payments-title">Pagos</h2>
    <p class="payments-subtitle">Cuota mensual de la sala. Se paga hasta el día 10 de cada mes — enviar el comprobante por el grupo de WhatsApp.</p>

    <div class="payments-month-nav">
      <p id="paymentMonthLabel"></p>
    </div>

    <div id="paymentsPanel"></div>
    <div id="adminArea" class="admin-area"></div>
  </section>
</div>

<!--
  IMPORTANTE — SEGURIDAD:
  Este archivo por sí solo NO protege los datos. Los botones de admin que
  ves en la interfaz solo controlan qué se MUESTRA; lo que realmente
  decide quién puede escribir en la base son las Reglas de Firebase.

  Andá a Firebase Console → tu proyecto → Realtime Database → Rules,
  y pegá esto (reemplaza cualquier regla de "modo test"):

  {
    "rules": {
      "reservas": {
        ".read": true,
        "$id": {
          ".write": "auth != null && (!data.exists() || data.child('owner').val() === auth.uid || auth.token.firebase.sign_in_provider !== 'anonymous')"
        }
      },
      "pagos": {
        ".read": true,
        ".write": "auth != null && auth.token.firebase.sign_in_provider !== 'anonymous'"
      }
    }
  }

  Esto permite: cualquiera lee todo y crea una reserva nueva; solo el
  dueño de una reserva (o el admin logueado con email/contraseña) puede
  editarla o borrarla; y solo el admin puede tocar "pagos". Sin esto,
  cualquiera con el link puede escribir directamente en la base
  saltándose por completo esta página.
-->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInAnonymously,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC22WibCcJ6xErPI96cE__IIeDjAmji51Q",
  authDomain: "reservas-ensayo.firebaseapp.com",
  databaseURL: "https://reservas-ensayo-default-rtdb.firebaseio.com/",
  projectId: "reservas-ensayo",
  storageBucket: "reservas-ensayo.firebasestorage.app",
  messagingSenderId: "1043763747030",
  appId: "1:1043763747030:web:da45e8a34cf230c683d177"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const PERSONAS = [
  { id:'agus', nombre:'Agus' },
  { id:'gonza', nombre:'Gonza' },
  { id:'juli', nombre:'Juli' },
  { id:'karty', nombre:'Karty' },
  { id:'luca', nombre:'Luca' },
  { id:'lucho', nombre:'Lucho' },
  { id:'nico-1', nombre:'Nico 1' },
  { id:'nico-2', nombre:'Nico 2' },
  { id:'pablo', nombre:'Pablo' },
  { id:'vico', nombre:'Vico' }
];

const state = {
  reservas: [],
  pagos: {},
  viewYear: null,
  viewMonth: null,
  selectedDate: null,
  uid: null,
  ready: false,
  paymentsReady: false,
  isAdmin: false,
  paymentYear: null,
  paymentMonth: null,
  showAdminLogin: false
};

let unsubscribeReservas = null;
let unsubscribePagos = null;

const today = new Date();
today.setHours(0,0,0,0);

state.viewYear = today.getFullYear();
state.viewMonth = today.getMonth();
state.selectedDate = fmtDate(today);
state.paymentYear = today.getFullYear();
state.paymentMonth = today.getMonth();

const monthLabelEl = document.getElementById('monthLabel');
const weekdaysEl = document.getElementById('weekdays');
const gridEl = document.getElementById('calendarGrid');
const panelEl = document.getElementById('dayPanel');

const paymentMonthLabelEl = document.getElementById('paymentMonthLabel');
const paymentsPanelEl = document.getElementById('paymentsPanel');
const adminAreaEl = document.getElementById('adminArea');

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['lun','mar','mié','jue','vie','sáb','dom'];

DIAS.forEach(function(d){
  const s = document.createElement('span');
  s.textContent = d;
  weekdaysEl.appendChild(s);
});

function fmtDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function parseDate(s){
  const parts = s.split('-').map(Number);
  return new Date(parts[0], parts[1]-1, parts[2]);
}

function displayDate(s){
  return parseDate(s).toLocaleDateString('es-AR',{ weekday:'long', day:'numeric', month:'long' });
}

function paymentMonthKey(){
  return state.paymentYear + '-' + String(state.paymentMonth + 1).padStart(2,'0');
}

/* ---------------- BLOQUEO DE INTENTOS DE LOGIN (ADMIN) ---------------- */
/* Nota: esto se guarda en localStorage del navegador. Frena intentos
   repetidos desde el mismo dispositivo, pero no reemplaza una protección
   del lado del servidor (eso requeriría Firebase App Check o una Cloud
   Function con rate limiting). */

const ADMIN_LOCK_KEY = 'adminLoginLock_v1';

function getAdminLockState(){
  try{
    const raw = localStorage.getItem(ADMIN_LOCK_KEY);
    if(!raw) return { fails: 0, lockUntil: 0 };
    const parsed = JSON.parse(raw);
    return { fails: parsed.fails || 0, lockUntil: parsed.lockUntil || 0 };
  }catch(e){
    return { fails: 0, lockUntil: 0 };
  }
}

function setAdminLockState(s){
  try{ localStorage.setItem(ADMIN_LOCK_KEY, JSON.stringify(s)); }catch(e){}
}

function registerAdminLoginFailure(){
  const s = getAdminLockState();
  s.fails += 1;
  const now = Date.now();
  if(s.fails === 3){
    s.lockUntil = now + 15 * 60 * 1000; // 15 minutos
  } else if(s.fails >= 8){
    s.lockUntil = now + 6 * 60 * 60 * 1000; // 6 horas
  }
  setAdminLockState(s);
  return s;
}

function registerAdminLoginSuccess(){
  setAdminLockState({ fails: 0, lockUntil: 0 });
}

function adminLockRemainingMs(){
  const s = getAdminLockState();
  const remaining = s.lockUntil - Date.now();
  return remaining > 0 ? remaining : 0;
}

function formatLockRemaining(ms){
  if(ms > 60 * 60 * 1000){
    const hrs = Math.ceil(ms / (60 * 60 * 1000));
    return hrs + (hrs === 1 ? ' hora' : ' horas');
  }
  const mins = Math.max(1, Math.ceil(ms / (60 * 1000)));
  return mins + (mins === 1 ? ' minuto' : ' minutos');
}

function reservasDelDia(dateStr){
  return state.reservas
    .filter(function(r){ return r.date === dateStr; })
    .sort(function(a,b){ return (a.startTime || '').localeCompare(b.startTime || ''); });
}

/* ---------------- CALENDARIO / RESERVAS ---------------- */

function renderCalendar(){
  monthLabelEl.textContent = MESES[state.viewMonth] + ' ' + state.viewYear;
  gridEl.innerHTML = '';

  const first = new Date(state.viewYear, state.viewMonth, 1);
  let startOffset = first.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(state.viewYear, state.viewMonth+1, 0).getDate();

  for(let i=0;i<startOffset;i++) gridEl.appendChild(document.createElement('div'));

  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(state.viewYear, state.viewMonth, day);
    const dateStr = fmtDate(d);
    const count = reservasDelDia(dateStr).length;
    const isToday = fmtDate(today) === dateStr;
    const isSelected = state.selectedDate === dateStr;
    const isPast = d < today;

    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'day-cell' + (isSelected ? ' selected' : '') + (isPast ? ' past' : '');
    cell.setAttribute('aria-label', displayDate(dateStr) + (count ? ', ' + count + ' reserva(s)' : ', sin reservas'));

    const num = document.createElement('span');
    num.className = 'day-num' + (isToday ? ' today' : '');
    num.textContent = day;
    cell.appendChild(num);

    const dot = document.createElement('span');
    dot.className = 'day-dot';
    dot.textContent = count > 0 ? (count > 3 ? '3+' : '\u2022'.repeat(count)) : '\u00A0';
    cell.appendChild(dot);

    cell.addEventListener('click', function(){
      state.selectedDate = dateStr;
      renderCalendar();
      renderPanel();
    });

    gridEl.appendChild(cell);
  }
}

function renderPanel(){
  const dateStr = state.selectedDate;
  const list = reservasDelDia(dateStr);
  const isPast = parseDate(dateStr) < today;

  panelEl.innerHTML = '';

  const heading = document.createElement('h2');
  heading.textContent = displayDate(dateStr);
  panelEl.appendChild(heading);

  if(!state.ready){
    const loading = document.createElement('p');
    loading.className = 'empty-note';
    loading.textContent = 'Conectando con las reservas…';
    panelEl.appendChild(loading);
    return;
  }

  if(list.length === 0){
    const empty = document.createElement('p');
    empty.className = 'empty-note';
    empty.textContent = 'Todavía nadie reservó este día.';
    panelEl.appendChild(empty);
  } else {
    list.forEach(function(r){
      const row = document.createElement('div');
      row.className = 'res-row';

      const left = document.createElement('div');
      left.className = 'res-left';

      const time = document.createElement('span');
      time.className = 'res-time';
      time.textContent = r.startTime + '–' + r.endTime;

      const name = document.createElement('span');
      name.className = 'res-name';
      name.textContent = r.name;

      left.appendChild(time);
      left.appendChild(name);
      row.appendChild(left);

      const isOwner = r.owner === state.uid;
      if(isOwner || state.isAdmin){
        const del = document.createElement('button');
        del.className = 'del-btn';
        del.setAttribute('aria-label', isOwner ? 'Cancelar tu reserva' : 'Cancelar la reserva de ' + r.name);
        del.title = isOwner ? 'Cancelar mi reserva' : 'Cancelar reserva (admin)';
        del.textContent = '\u2715';

        del.addEventListener('click', async function(){
          const confirmMsg = isOwner
            ? '¿Cancelar tu reserva de ' + r.startTime + ' a ' + r.endTime + '?'
            : '¿Cancelar la reserva de ' + r.name + ' (' + r.startTime + ' a ' + r.endTime + ')?';
          const ok = window.confirm(confirmMsg);
          if(!ok) return;

          try {
            await remove(ref(db, 'reservas/' + r.id));
          } catch(err) {
            window.alert('No se pudo cancelar la reserva. Recargá la página e intentá nuevamente.');
            console.error(err);
          }
        });

        row.appendChild(del);
      }

      panelEl.appendChild(row);
    });
  }

  if(isPast){
    const note = document.createElement('p');
    note.className = 'past-note';
    note.textContent = 'Esta fecha ya pasó.';
    panelEl.appendChild(note);
    return;
  }

  const form = document.createElement('form');

  const nameField = document.createElement('div');
  nameField.className = 'field name';
  nameField.innerHTML = '<label for="nameInput">Nombre</label>';

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.id = 'nameInput';
  nameInput.placeholder = '';
  nameInput.maxLength = 40;
  nameInput.value = localStorage.getItem('nombreReserva') || '';
  nameField.appendChild(nameInput);

  const startField = document.createElement('div');
  startField.className = 'field time';
  startField.innerHTML = '<label for="startInput">Desde</label>';

  const startInput = document.createElement('input');
  startInput.type = 'time';
  startInput.id = 'startInput';
  startField.appendChild(startInput);

  const endField = document.createElement('div');
  endField.className = 'field time';
  endField.innerHTML = '<label for="endInput">Hasta</label>';

  const endInput = document.createElement('input');
  endInput.type = 'time';
  endInput.id = 'endInput';
  endField.appendChild(endInput);

  startInput.addEventListener('change', function(){
    if(!startInput.value) return;

    const [hours, minutes] = startInput.value.split(':').map(Number);
    const totalMinutes = hours * 60 + minutes + 120;

    if(totalMinutes < 24 * 60){
      const endHours = Math.floor(totalMinutes / 60);
      const endMinutes = totalMinutes % 60;

      endInput.value =
        String(endHours).padStart(2,'0') + ':' +
        String(endMinutes).padStart(2,'0');
    }
  });

  const submitBtn = document.createElement('button');
  submitBtn.type = 'submit';
  submitBtn.textContent = 'Reservar';

  const errorEl = document.createElement('p');
  errorEl.className = 'error-msg';

  form.appendChild(nameField);
  form.appendChild(startField);
  form.appendChild(endField);
  form.appendChild(submitBtn);
  form.appendChild(errorEl);

  form.addEventListener('submit', async function(e){
    e.preventDefault();

    const name = nameInput.value.trim();
    const startTime = startInput.value;
    const endTime = endInput.value;

    if(!name || !startTime || !endTime){
      errorEl.textContent = 'Completá tu nombre, hora de inicio y hora de fin.';
      errorEl.style.display = 'block';
      return;
    }

    if(endTime <= startTime){
      errorEl.textContent = 'La hora de fin tiene que ser posterior a la hora de inicio.';
      errorEl.style.display = 'block';
      return;
    }

    const clash = reservasDelDia(dateStr).some(function(r){
      return startTime < r.endTime && endTime > r.startTime;
    });

    if(clash){
      errorEl.textContent = 'Esa franja se superpone con otra reserva. Elegí otro horario.';
      errorEl.style.display = 'block';
      return;
    }

    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Reservando…';

    const id = dateStr + '-' + startTime.replace(':','') + '-' + Date.now();
    const reserva = { date: dateStr, startTime, endTime, name, owner: state.uid };

    try {
      await set(ref(db, 'reservas/' + id), reserva);

      localStorage.setItem('nombreReserva', name);
      submitBtn.textContent = 'Reserva guardada ✓';

      setTimeout(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reservar';
      }, 2000);

    } catch(err) {
      errorEl.textContent = 'No se pudo guardar la reserva. Revisá la conexión e intentá nuevamente.';
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reservar';
      console.error(err);
    }
  });

  panelEl.appendChild(form);
}

/* ---------------- PAGOS ---------------- */

function renderPayments(){
  paymentMonthLabelEl.textContent = MESES[state.paymentMonth] + ' ' + state.paymentYear;
  paymentsPanelEl.innerHTML = '';

  if(!state.paymentsReady){
    const loading = document.createElement('p');
    loading.className = 'empty-note';
    loading.textContent = 'Cargando estado de pagos…';
    paymentsPanelEl.appendChild(loading);
    renderAdminArea();
    return;
  }

  const key = paymentMonthKey();
  const monthPayments = state.pagos[key] || {};
  const paidCount = PERSONAS.filter(function(p){ return monthPayments[p.id] === true; }).length;

  const summary = document.createElement('div');
  summary.className = 'payments-summary';
  summary.innerHTML = '<span><strong>' + paidCount + ' de ' + PERSONAS.length + '</strong> pagaron</span><span>' + Math.round((paidCount / PERSONAS.length) * 100) + '%</span>';
  paymentsPanelEl.appendChild(summary);

  const progress = document.createElement('div');
  progress.className = 'progress';
  const progressInner = document.createElement('div');
  progressInner.style.width = ((paidCount / PERSONAS.length) * 100) + '%';
  progress.appendChild(progressInner);
  paymentsPanelEl.appendChild(progress);

  const list = document.createElement('div');
  list.className = 'payment-list';

  PERSONAS.forEach(function(person){
    const paid = monthPayments[person.id] === true;

    const row = document.createElement('div');
    row.className = 'payment-row' + (paid ? ' paid' : '');

    const personBox = document.createElement('div');
    personBox.className = 'payment-person';

    const dot = document.createElement('span');
    dot.className = 'payment-dot';
    dot.textContent = paid ? '✓' : '';

    const name = document.createElement('span');
    name.textContent = person.nombre + (paid ? ' · Pagado' : '');

    personBox.appendChild(dot);
    personBox.appendChild(name);
    row.appendChild(personBox);

    if(state.isAdmin){
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'payment-toggle';
      toggle.textContent = paid ? 'Desmarcar' : 'Pagó';

      toggle.addEventListener('click', async function(){
        toggle.disabled = true;
        try {
          const paymentRef = ref(db, 'pagos/' + key + '/' + person.id);
          if(paid){
            await remove(paymentRef);
          } else {
            await set(paymentRef, true);
          }
        } catch(err) {
          window.alert('No se pudo cambiar el estado del pago. Revisá las reglas de Firebase.');
          console.error(err);
          toggle.disabled = false;
        }
      });

      row.appendChild(toggle);
    }

    list.appendChild(row);
  });

  paymentsPanelEl.appendChild(list);

  renderAdminArea();
}

function renderAdminArea(){
  adminAreaEl.innerHTML = '';
  clearTimeout(state.lockTimer);

  if(state.isAdmin){
    const row = document.createElement('div');
    row.className = 'admin-state';

    const text = document.createElement('span');
    text.textContent = 'Administrador';

    const logout = document.createElement('button');
    logout.type = 'button';
    logout.className = 'admin-logout';
    logout.textContent = 'Salir';

    logout.addEventListener('click', async function(){
      try {
        await signOut(auth);
        await signInAnonymously(auth);
      } catch(err) {
        window.alert('No se pudo cerrar el modo administrador.');
        console.error(err);
      }
    });

    row.appendChild(text);
    row.appendChild(logout);
    adminAreaEl.appendChild(row);
    return;
  }

  const lockRemaining = adminLockRemainingMs();
  if(lockRemaining > 0){
    state.showAdminLogin = false;
    const lockBox = document.createElement('div');
    lockBox.className = 'admin-login';
    const msg = document.createElement('p');
    msg.className = 'admin-lock-msg';
    msg.textContent = 'Demasiados intentos fallidos. Podés volver a intentar en ' + formatLockRemaining(lockRemaining) + '.';
    lockBox.appendChild(msg);
    adminAreaEl.appendChild(lockBox);

    // Vuelve a renderizar automáticamente apenas se cumpla el bloqueo.
    state.lockTimer = setTimeout(renderAdminArea, Math.min(lockRemaining + 1000, 2147483647));
    return;
  }

  if(!state.showAdminLogin){
    const open = document.createElement('button');
    open.type = 'button';
    open.className = 'admin-link';
    open.textContent = 'Editar pagos';
    open.addEventListener('click', function(){
      state.showAdminLogin = true;
      renderAdminArea();
    });
    adminAreaEl.appendChild(open);
    return;
  }

  const box = document.createElement('div');
  box.className = 'admin-login';

  const form = document.createElement('form');

  const emailField = document.createElement('div');
  emailField.className = 'field';
  emailField.innerHTML = '<label for="adminEmail">Email</label>';
  const emailInput = document.createElement('input');
  emailInput.type = 'email';
  emailInput.id = 'adminEmail';
  emailInput.autocomplete = 'username';
  emailField.appendChild(emailInput);

  const passwordField = document.createElement('div');
  passwordField.className = 'field';
  passwordField.innerHTML = '<label for="adminPassword">Contraseña</label>';

  const passwordWrap = document.createElement('div');
  passwordWrap.className = 'password-wrap';

  const passwordInput = document.createElement('input');
  passwordInput.type = 'password';
  passwordInput.id = 'adminPassword';
  passwordInput.autocomplete = 'current-password';
  passwordWrap.appendChild(passwordInput);

  const toggleBtn = document.createElement('button');
  toggleBtn.type = 'button';
  toggleBtn.className = 'password-toggle';
  toggleBtn.textContent = 'Mostrar';
  toggleBtn.title = 'Mantené presionado para ver la contraseña';
  toggleBtn.setAttribute('aria-label', 'Mantener presionado para ver la contraseña');

  function revealPassword(){
    passwordInput.type = 'text';
  }
  function hidePassword(){
    passwordInput.type = 'password';
  }

  // Mouse
  toggleBtn.addEventListener('mousedown', function(e){ e.preventDefault(); revealPassword(); });
  toggleBtn.addEventListener('mouseup', hidePassword);
  toggleBtn.addEventListener('mouseleave', hidePassword);
  // Touch (celular)
  toggleBtn.addEventListener('touchstart', function(e){ e.preventDefault(); revealPassword(); }, { passive: false });
  toggleBtn.addEventListener('touchend', hidePassword);
  toggleBtn.addEventListener('touchcancel', hidePassword);
  // Teclado (accesibilidad: mantener Enter/Espacio apretado)
  toggleBtn.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.key === 'Enter'){
      e.preventDefault();
      revealPassword();
    }
  });
  toggleBtn.addEventListener('keyup', function(e){
    if(e.key === ' ' || e.key === 'Enter'){
      hidePassword();
    }
  });
  // Si el foco se pierde mientras está mostrando, ocultarla igual
  toggleBtn.addEventListener('blur', hidePassword);

  passwordWrap.appendChild(toggleBtn);

  passwordField.appendChild(passwordWrap);

  const submit = document.createElement('button');
  submit.type = 'submit';
  submit.textContent = 'Entrar';

  const error = document.createElement('p');
  error.className = 'error-msg';

  form.appendChild(emailField);
  form.appendChild(passwordField);
  form.appendChild(submit);
  form.appendChild(error);

  form.addEventListener('submit', async function(e){
    e.preventDefault();

    if(adminLockRemainingMs() > 0){
      renderAdminArea();
      return;
    }

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if(!email || !password){
      error.textContent = 'Completá email y contraseña.';
      error.style.display = 'block';
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Entrando…';
    error.style.display = 'none';

    try {
      await signInWithEmailAndPassword(auth, email, password);
      registerAdminLoginSuccess();
      state.showAdminLogin = false;
    } catch(err) {
      const lockState = registerAdminLoginFailure();
      const remaining = adminLockRemainingMs();

      if(remaining > 0){
        renderAdminArea();
        return;
      }

      let attemptsMsg = '';
      if(lockState.fails < 3){
        const left = 3 - lockState.fails;
        attemptsMsg = ' (' + left + (left === 1 ? ' intento' : ' intentos') + ' antes del bloqueo)';
      } else if(lockState.fails < 8){
        const left = 8 - lockState.fails;
        attemptsMsg = ' (' + left + (left === 1 ? ' intento' : ' intentos') + ' antes del bloqueo largo)';
      }

      error.textContent = 'Email o contraseña incorrectos.' + attemptsMsg;
      error.style.display = 'block';
      submit.disabled = false;
      submit.textContent = 'Entrar';
      console.error(err);
    }
  });

  box.appendChild(form);

  const cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.className = 'admin-link';
  cancel.style.marginTop = '10px';
  cancel.textContent = 'Cancelar';
  cancel.addEventListener('click', function(){
    state.showAdminLogin = false;
    renderAdminArea();
  });

  box.appendChild(cancel);
  adminAreaEl.appendChild(box);
}

/* ---------------- NAVEGACIÓN ---------------- */

document.getElementById('prevMonth').addEventListener('click', function(){
  state.viewMonth--;
  if(state.viewMonth < 0){
    state.viewMonth = 11;
    state.viewYear--;
  }
  renderCalendar();
});

document.getElementById('nextMonth').addEventListener('click', function(){
  state.viewMonth++;
  if(state.viewMonth > 11){
    state.viewMonth = 0;
    state.viewYear++;
  }
  renderCalendar();
});

/* ---------------- FIREBASE ---------------- */

function startDatabaseListeners(){
  if(unsubscribeReservas) unsubscribeReservas();
  if(unsubscribePagos) unsubscribePagos();

  state.ready = false;
  state.paymentsReady = false;
  renderPanel();
  renderPayments();

  unsubscribeReservas = onValue(ref(db, 'reservas'), function(snapshot){
    const data = snapshot.val() || {};
    state.reservas = Object.entries(data).map(function([id, r]){
      return { id, ...r };
    });
    state.ready = true;
    renderCalendar();
    renderPanel();
  }, function(err){
    state.ready = true;
    panelEl.innerHTML = '<p class="error-msg" style="display:block">No se pudieron cargar las reservas. Revisá las reglas de Firebase.</p>';
    console.error(err);
  });

  unsubscribePagos = onValue(ref(db, 'pagos'), function(snapshot){
    state.pagos = snapshot.val() || {};
    state.paymentsReady = true;
    renderPayments();
  }, function(err){
    state.paymentsReady = true;
    paymentsPanelEl.innerHTML = '<p class="error-msg" style="display:block">No se pudieron cargar los pagos. Revisá las reglas de Firebase.</p>';
    console.error(err);
  });
}

renderCalendar();
renderPanel();
renderPayments();

onAuthStateChanged(auth, function(user){
  if(user){
    state.uid = user.uid;
    state.isAdmin = !user.isAnonymous;
    startDatabaseListeners();
    renderAdminArea();
  }
});

if(!auth.currentUser){
  signInAnonymously(auth).catch(function(err){
    state.ready = true;
    state.paymentsReady = true;
    panelEl.innerHTML = '<p class="error-msg" style="display:block">No se pudo iniciar la sesión anónima. Revisá Authentication en Firebase.</p>';
    paymentsPanelEl.innerHTML = '<p class="error-msg" style="display:block">No se pudo iniciar la sesión.</p>';
    console.error(err);
  });
}
</script>
